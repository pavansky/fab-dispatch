name: CI

# Every push and pull request runs the full gate. The release workflow calls this same
# workflow, so production is only ever promoted from a commit that passed it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-quality:
    name: backend · lint, format, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres here too, so coverage counts the production store, not only SQLite.
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: fab, POSTGRES_DB: fab }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      FAB_TEST_PG_URL: postgresql://postgres:fab@localhost:5432/fab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: ruff format --check app tests scripts
      - name: Tests with coverage floor
        run: pytest -q --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=90
      - name: Assistant evaluation report (job summary)
        if: always()
        run: python -m scripts.eval_report >> "$GITHUB_STEP_SUMMARY"

  backend-matrix:
    name: backend · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: { python: ["3.11", "3.12", "3.14"] }
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  backend-postgres:
    name: backend · Postgres store + migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: fab, POSTGRES_DB: fab }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      FAB_DATABASE_URL: postgresql://postgres:fab@localhost:5432/fab
      FAB_TEST_PG_URL: postgresql://postgres:fab@localhost:5432/fab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    name: frontend · lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - name: Unit and component tests with coverage floor
        run: npm run test:coverage
      - run: npm run build

  e2e:
    name: e2e · Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: End-to-end tests (real API + UI, desktop and phone)
        run: npm run test:e2e
        working-directory: frontend
        env: { E2E_PYTHON: python }
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  security:
    name: security · dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt --progress-spinner off
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci --prefix frontend && npm audit --prefix frontend --audit-level=high

  docker:
    name: images · build, run, scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend-quality, frontend, e2e]
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the production-like stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: The stack serves the app, the API and sign-in
        run: |
          until curl -sf -o /dev/null localhost:8080/; do sleep 2; done
          curl -sf localhost:8080/api/health | tee health.json
          python3 -c "import json; h=json.load(open('health.json')); assert h['status']=='ok' and h['schema_ok'], h"
          token=$(curl -sf -X POST localhost:8080/api/auth/demo -H 'content-type: application/json' \
            -d '{"role":"dispatcher"}' | python3 -c "import json,sys; print(json.load(sys.stdin)['access_token'])")
          curl -sf -o /dev/null -H "Authorization: Bearer $token" localhost:8080/api/fabs
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Scan images (critical and high vulnerabilities that have a fix)
        run: |
          for image in fab-dispatch-api:local fab-dispatch-ui:local; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.0 image \
              --quiet --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$image"
          done

  fab-databases:
    name: images · database per fab
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend-quality, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack with a separate Postgres for each fab
        run: docker compose -f docker-compose.yml -f docker-compose.fabs.yml up -d --build --wait --wait-timeout 240
      - name: Each fab's data is only in its own database (queried directly)
        run: |
          until curl -sf -o /dev/null localhost:8080/; do sleep 2; done
          scripts/check_fab_isolation.sh
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.fabs.yml logs --no-color

  workflows:
    name: workflows · actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Lint GitHub Actions workflows (with shellcheck)
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  dependency-review:
    name: security · dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: New dependencies must be free of known vulnerabilities and MIT-compatible
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0

  pr-hygiene:
    name: pr · conventional commits
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Title and every commit follow Conventional Commits, one author per commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
          pattern="^($types)(\([a-z0-9-]+\))?!?: .+"
          bad=0
          if ! grep -qE "$pattern" <<<"$TITLE"; then
            echo "::warning::PR title is not a Conventional Commit: $TITLE (it isn't used for merges; commits are)"
          fi
          while read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            grep -qE "$pattern" <<<"$subject" || { echo "::error::$sha: '$subject' is not a Conventional Commit"; bad=1; }
            if git log -1 --format=%B "$sha" | grep -qi '^co-authored-by:'; then
              echo "::error::$sha has a Co-authored-by trailer; commits here have a single author"; bad=1
            fi
          done < <(git rev-list --no-merges "$BASE..$HEAD")
          exit $bad
