name: CI

# Every push and pull request runs the full gate. The release workflow calls this same
# workflow, so production is only ever promoted from a commit that passed it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-quality:
    name: backend · lint, format, coverage
    runs-on: ubuntu-latest
    # Postgres here too, so coverage counts the production store, not only SQLite.
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: fab, POSTGRES_DB: fab }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      FAB_TEST_PG_URL: postgresql://postgres:fab@localhost:5432/fab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: ruff format --check app tests scripts
      - name: Tests with coverage floor
        run: pytest -q --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=90
      - name: Assistant evaluation report (job summary)
        if: always()
        run: python -m scripts.eval_report >> "$GITHUB_STEP_SUMMARY"

  backend-matrix:
    name: backend · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { python: ["3.11", "3.12", "3.14"] }
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  backend-postgres:
    name: backend · Postgres store + migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: fab, POSTGRES_DB: fab }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      FAB_DATABASE_URL: postgresql://postgres:fab@localhost:5432/fab
      FAB_TEST_PG_URL: postgresql://postgres:fab@localhost:5432/fab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    name: frontend · lint, test, build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - name: Unit and component tests with coverage floor
        run: npm run test:coverage
      - run: npm run build

  e2e:
    name: e2e · Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: End-to-end tests (real API + UI, desktop and phone)
        run: npm run test:e2e
        working-directory: frontend
        env: { E2E_PYTHON: python }
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  security:
    name: security · dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt --progress-spinner off
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci --prefix frontend && npm audit --prefix frontend --audit-level=high

  docker:
    name: images · build
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend, e2e]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
