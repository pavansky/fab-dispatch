name: Docs

# Builds the documentation site on every change (strict: broken links fail the build) and
# publishes it to GitHub Pages from main: https://pavansky.github.io/fab-dispatch/
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: docs · build (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "backend/requirements.txt\ndocs/requirements.txt" }
      - run: pip install -r backend/requirements.txt -r docs/requirements.txt
      - name: Generate pages from their sources (help articles, changelog, OpenAPI)
        run: python docs/build.py
      - run: mkdocs build --strict
        env: { NO_MKDOCS_2_WARNING: "1" }
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with: { path: site }

  deploy:
    name: docs · publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
