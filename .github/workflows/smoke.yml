name: Post-deploy smoke test

# Vercel reports each deployment back to GitHub. When one succeeds (a PR preview, UAT
# from main, or production), check it is healthy, its schema is current, and it runs
# real authentication, never demo mode. Production is checked on its public domain: the
# per-deployment URL sits behind Vercel Authentication even when the domain is public.
on: deployment_status

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    env:
      PRODUCTION: ${{ github.event.deployment.environment == 'Production' }}
      URL: >-
        ${{ github.event.deployment.environment == 'Production'
            && (vars.PRODUCTION_URL || 'https://fab-dispatch.vercel.app')
            || github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Health and auth mode
        run: |
          hdr=(); [ -n "$BYPASS" ] && hdr=(-H "x-vercel-protection-bypass: $BYPASS")
          for i in 1 2 3 4 5; do
            code=$(curl -s -o health.json -w '%{http_code}' "${hdr[@]}" "$URL/api/health") && [ "$code" = 200 ] && break
            sleep 10
          done
          # UAT and PR previews sit behind Vercel Authentication. Without the automation bypass
          # secret we can't reach them, so report that plainly instead of failing.
          if [ "$code" = 401 ] || [ "$code" = 302 ] || [ "$code" = 403 ]; then
            if [ -z "$BYPASS" ] && [ "$PRODUCTION" != true ]; then
              echo "::notice::$URL is protected by Vercel Authentication; add VERCEL_AUTOMATION_BYPASS_SECRET to smoke-test it. Skipped."
              exit 0
            fi
          fi
          cat health.json; echo
          python3 -c "import json; h=json.load(open('health.json')); assert h['status']=='ok' and h['schema_ok'], h"
          curl -sf "${hdr[@]}" "$URL/api/auth/config" | python3 -c "import json,sys; c=json.load(sys.stdin); assert c['mode']=='supabase', c; print('auth:', c['mode'])"
          # App tables must not be readable through Supabase's public Data API (migration 3).
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          cfg = json.load(urllib.request.urlopen(os.environ["URL"] + "/api/auth/config"))
          if cfg.get("mode") == "supabase":
              for table in ("shifts", "shift_events", "shift_presence", "plan_cache", "assistant_feedback"):
                  req = urllib.request.Request(f"{cfg['supabase_url']}/rest/v1/{table}?select=*&limit=1",
                                               headers={"apikey": cfg["supabase_publishable_key"]})
                  try:
                      rows = json.load(urllib.request.urlopen(req))
                      assert rows == [], f"{table} is readable with the public key"
                  except urllib.error.HTTPError as e:
                      assert e.code in (401, 403, 404), f"{table}: unexpected {e.code}"
                  print(f"{table}: closed to the public API")
          PY
