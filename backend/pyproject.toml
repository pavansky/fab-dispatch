[project]
name = "fab-dispatch"
version = "2.9.0"
license = "MIT"
description = "Resource allocation engine: equipment engineers to tool-downs and PMs in a semiconductor fab"
requires-python = ">=3.11"
readme = "../README.md"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "numpy>=2.3,<3",
    "scipy>=1.16,<2",
    "pyvrp==0.14.0",
    "qdrant-client==1.19.1",
    "pyjwt[crypto]==2.15.1",
    "psycopg[binary]==3.3.6",
    "highspy==1.15.1",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF005", "B008", "SIM108", "E731", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow tests (full-size optimality proofs, solvers at the shipped budgets) are skipped by default;
# CI runs them on pushes to main (`pytest -m slow`), and so can you.
addopts = "-m 'not slow'"
markers = ["slow: takes more than ~20 s (full-size exact proofs, shipped solver budgets); run with -m slow"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:.*httpx2.*"]

[tool.uv]
# PyVRP lists matplotlib for its optional plotting helpers; the app never imports them.
# Dropping the chain (matplotlib, pillow, contourpy, fonttools, ...) keeps the serverless
# bundle lean and cold starts fast.
override-dependencies = ["matplotlib; sys_platform == 'never'"]
