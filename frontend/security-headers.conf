# Security headers for every response the UI image serves.
#
# nginx's add_header is not inherited by a location that sets any add_header of its own, so a
# location with its own Cache-Control would silently drop every server-level header. This file is
# therefore included in the server block AND in every location that adds a header. The CSP here
# must stay identical to vercel.json and vite.config.js (a test checks all three).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Frame-Options DENY always;
